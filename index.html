<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <title>Pitsapaku kalenteri</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@5.11.3/main.global.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d; /* tumma tausta */
      color: #FFD700; /* kultainen teksti */
      font-family: 'Arial', sans-serif;
    }

    #calendar {
      max-width: 1000px;
      margin: 40px auto;
      background-color: #0d0d0d;
      border: 2px solid #FFD700;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .fc-toolbar-title {
      color: #FFD700;
      font-size: 1.8em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .fc-button {
      background-color: #FFD700;
      border: none;
      color: #000000;
      font-weight: bold;
      text-transform: uppercase;
    }

    .fc-button:hover {
      background-color: #ffcc00;
    }

    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number,
    .fc-timegrid-slot-label,
    .fc-timegrid-axis-cushion {
      color: #FFD700;
      font-weight: bold;
    }

    .fc-event {
      background-color: #1a1a1a !important;
      border: 1px solid #FFD700 !important;
      color: #FFD700 !important;
      font-size: 0.9em;
      white-space: normal !important; /* estää tekstin leikkautumisen */
      overflow: visible !important;
      padding: 4px;
    }

    .fc-event-title {
      font-weight: bold;
      color: #FFD700;
    }

    .fc-event-time {
      color: #FFD700;
      font-weight: normal;
    }

    .fc-scrollgrid {
      background-color: #0d0d0d;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'fi',
        firstDay: 1,
        slotMinTime: '08:00:00',
        slotMaxTime: '23:00:00',
        allDaySlot: false,

        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        googleCalendarApiKey: 'AIzaSyBH2DFW42Im8sKn0ibX-szlr6Hh4FriVF8',
        events: {
          googleCalendarId: 'pitsapaku@gmail.com'
        },

        eventContent: function(arg) {
          let start = arg.event.start;
          let end = arg.event.end;
          let aika = start.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' }) +
                     " - " +
                     end.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
          let paikka = arg.event.extendedProps.location || "";
          return {
            html: `<div><b>${aika}</b><br>${paikka}</div>`
          };
        },

        eventClick: function(info) {
          info.jsEvent.preventDefault(); // estää linkin avautumisen
        }
      });

      calendar.render();
    });
  </script>
</body>
</html>
