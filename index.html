<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <title>Pitsapaku kalenteri</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@5.11.3/main.global.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      color: #FFD700;
      font-family: Arial, sans-serif;
    }

    #calendar {
      max-width: 1000px;
      margin: 40px auto;
      background-color: #0d0d0d;
      border: 2px solid #FFD700;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    /* 🔥 Napolin kultainen tyyli + musta teksti valikoissa */
    .fc-toolbar-title {
      color: #000000 !important;
      font-size: 1.8em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      background-color: #FFD700;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .fc-button {
      background-color: #FFD700 !important;
      border: none !important;
      color: #000000 !important;
      font-weight: bold;
      text-transform: uppercase;
    }

    .fc-button:hover {
      background-color: #e6c200 !important;
      color: #000000 !important;
    }

    /* Päivien otsikot kultaisella taustalla ja mustalla tekstillä */
    .fc-col-header-cell {
      background-color: #FFD700 !important;
      color: #000000 !important;
      font-weight: bold;
    }

    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number {
      color: #000000 !important;
      font-weight: bold;
    }

    /* Tapahtumalaatikot kultaisella tekstillä mustalla taustalla */
    .fc-event {
      background-color: #1a1a1a !important;
      border: 1px solid #FFD700 !important;
      color: #FFD700 !important;
      font-size: 0.9em;
      white-space: normal !important;
      overflow: visible !important;
      padding: 4px;
    }

    /* 🔥 Pakotetaan kultainen teksti tapahtumiin */
    .fc-event,
    .fc-event *,
    .fc-daygrid-event,
    .fc-daygrid-event *,
    .fc-timegrid-event,
    .fc-timegrid-event * {
      color: #FFD700 !important;
      border-color: #FFD700 !important;
    }

    /* Kellonajat kultaisiksi */
    .fc-timegrid-slot-label,
    .fc-timegrid-axis-cushion {
      color: #FFD700 !important;
    }

    /* Poistetaan linkkityyli */
    .fc-event a {
      color: #FFD700 !important;
      text-decoration: none !important;
    }

    .fc-scrollgrid {
      background-color: #0d0d0d;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');

      var calendar = new FullCalendar.Calendar(calendarEl, {

        /* 🔥 Kuukausinäkymä avautuu ensimmäisenä */
        initialView: 'dayGridMonth',

        locale: 'fi',
        firstDay: 1,
        slotMinTime: '08:00:00',
        slotMaxTime: '23:00:00',
        allDaySlot: false,

        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        googleCalendarApiKey: 'AIzaSyBH2DFW42Im8sKn0ibX-szlr6Hh4FriVF8',
        events: {
          googleCalendarId: 'pitsapaku@gmail.com'
        },

        /* 🔥 Näytetään aika + paikka (description → location) */
        eventContent: function(arg) {
          let start = arg.event.start;
          let end = arg.event.end;

          let aika =
            start.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' }) +
            ' - ' +
            end.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });

          let paikka =
            arg.event.extendedProps.description ||
            arg.event.extendedProps.location ||
            '';

          return {
            html: `<div style="white-space:normal;"><b>${aika}</b><br>${paikka}</div>`
          };
        },

        /* 🔥 Estetään klikkaus */
        eventClick: function(info) {
          info.jsEvent.preventDefault();
          return false;
        },

        /* 🔥 Poistetaan linkki DOM:ista */
        eventDidMount: function(info) {
          let a = info.el.querySelector('a');
          if (a) {
            a.removeAttribute('href');
            a.style.cursor = 'default';
          }
        }
      });

      calendar.render();
    });
  </script>
</body>
</html>
